- shell:
  - [git submodule update --init --recursive, Installing submodules]
  - command: >-
      /bin/bash -lc 'cd pi/agent && PATH="$HOME/.local/share/mise/shims:$PATH" npm ci'
    description: Installing pi agent dependencies
  - command: >-
      /bin/bash -lc 'cd pi/agent/extensions/web-tools && PATH="$HOME/.local/share/mise/shims:$PATH" npm ci'
    description: Installing pi web-tools dependencies
  - command: >-
      /bin/bash -lc 'cd pi/agent/extensions/fff-native && PATH="$HOME/.local/share/mise/shims:$PATH" npm ci'
    description: Installing pi fff-native dependencies
  - command: >-
      /bin/bash -lc 'cd .agents/skills/web-browser/scripts && PATH="$HOME/.local/share/mise/shims:$PATH" npm ci'
    description: Installing pi web-browser helper dependencies
